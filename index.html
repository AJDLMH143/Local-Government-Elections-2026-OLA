<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Love Alliance Local Goverment Elections 4 Nov 2026</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fae8ff 100%);
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.25);
      --box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .top-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(to right, var(--text-main), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 640px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .time-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 28px 16px;
      box-shadow: var(--box-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-value {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 12px;
      font-weight: 600;
    }

    .event-info {
      display: inline-block;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.95rem;
      color: var(--text-muted);
      backdrop-filter: blur(12px);
    }

    .finished-message {
      display: none;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="top-controls">
    <button class="btn-icon" id="themeToggle" onclick="toggleTheme()">
      🌙 <span id="themeLabel">Dark Mode</span>
    </button>
  </div>

  <div class="container">
    <h1>Countdown to 04th November 2026</h1>
    <p class="subtitle">Time remaining until target date</p>

    <div class="countdown-grid" id="countdownGrid">
      <div class="time-card">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </div>

    <div class="finished-message" id="finishedMessage">
      🎉 The Target Date Has Arrived! 🎉
    </div>

    <div class="event-info">
      Target Date: <strong>November 4, 2026 00:00:00</strong>
    </div>
  </div>

  <script>
    // Set Target Date to 04 November 2026
    const targetDate = new Date("November 4, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.getElementById("countdownGrid").style.display = "none";
        document.getElementById("finishedMessage").style.display = "block";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, '0');
      document.getElementById("hours").textContent = String(hours).padStart(2, '0');
      document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
      document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
    }

    // Initialize timer
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Theme Toggle Functionality
    let isDark = true;
    function toggleTheme() {
      isDark = !isDark;
      if (isDark) {
        document.body.removeAttribute("data-theme");
        document.getElementById("themeToggle").innerHTML = '🌙 <span>Dark Mode</span>';
      } else {
        document.body.setAttribute("data-theme", "light");
        document.getElementById("themeToggle").innerHTML = '☀️ <span>Light Mode</span>';
      }
    }
  </script>
</body>
</html>
